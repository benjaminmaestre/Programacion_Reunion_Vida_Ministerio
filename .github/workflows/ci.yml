name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Synchronize lockfile for dependency updates
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run Vitest Unit Tests
        run: npm test
      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_NEON_DATA_API_URL: https://data.example.invalid/rest/v1
          NEXT_PUBLIC_NEON_AUTH_URL: https://auth.example.invalid
          NEON_AUTH_BASE_URL: https://auth.example.invalid
          NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-do-not-use-in-production-123456
